name: Monorepo CI Pipeline

on:
  push:
    branches: [ "main", "debug" ]
  pull_request:
    branches: [ "main", "debug" ]

jobs:
  # ---------------------------------------------
  # 1. FRONTEND: LINT, TYPECHECK, BUILD
  # ---------------------------------------------
  frontend-checks:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './apps/frontend/package-lock.json'
      - name: Install Dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Typecheck (tsc)
        run: npx tsc --noEmit
      - name: Dry Build
        run: npm run build

  # ---------------------------------------------
  # 2. ORCHESTRATOR: SYNTAX & HEALTH
  # ---------------------------------------------
  orchestrator-checks:
    name: Orchestrator (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/orchestrator
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Install Dependencies
        run: npm ci || npm install
      - name: Syntax Check
        run: node -c server.js

  # ---------------------------------------------
  # 3. BACKEND AI: RUFF LINTING
  # ---------------------------------------------
  backend-ai-checks:
    name: Backend AI (Python FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/backend-ai
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Dependencies via uv
        run: uv pip install --system -r requirements.txt || true
      - name: Ruff Linting
        run: |
          uv pip install --system ruff
          ruff check . || true

  # ---------------------------------------------
  # 4. DOCKER BUILD DRY RUN
  # ---------------------------------------------
  docker-build-test:
    name: Dockerfiles Integrity Check
    needs: [frontend-checks, orchestrator-checks, backend-ai-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Build Docker Images
        run: docker compose -f docker/docker-compose.dev.yml build
